<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>맘풀고 · 레벨1</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar__left">
      <div class="badge" id="topicBadge">01</div>
      <div class="title" id="topicTitle">눈빛 콘택트</div>
    </div>
    <div class="topbar__right">
      <div class="progress" id="progressText">준비</div>
    </div>
  </div>

  <main class="wrap" id="app">
    <!-- Setup (닉네임 없을 때만) -->
    <section class="screen" id="screenSetup" hidden>
      <div class="card">
        <h1 class="h1">애칭을 입력해 주세요</h1>
        <p class="p">애칭은 대본 문장에 자동으로 들어갑니다.</p>

        <label class="label">나(사람 A)</label>
        <input class="input" id="inputA" placeholder="예: 딸기" maxlength="12" />

        <label class="label">상대(사람 B)</label>
        <input class="input" id="inputB" placeholder="예: 포도" maxlength="12" />

        <button class="btn btn--primary" id="btnSetupStart">시작</button>
      </div>
    </section>

    <!-- Ready -->
    <section class="screen" id="screenReady" hidden>
      <div class="card">
        <div class="kicker">활동</div>
        <h1 class="h1">눈빛 콘택트</h1>
        <p class="p" id="activityText"></p>

        <div class="divider"></div>

        <div class="kicker">시작 멘트</div>
        <p class="quote" id="openingLine"></p>

        <button class="btn btn--primary" id="btnBegin">6턴 시작하기</button>
      </div>
    </section>

    <!-- Turn -->
    <section class="screen" id="screenTurn" hidden>
      <div class="card">
        <div class="meta" id="turnMeta"></div>

        <div id="blockEmpathy" class="block" hidden>
          <div class="kicker">먼저 알아주기</div>
          <p class="big" id="empathyText"></p>
        </div>

        <div id="blockSelf" class="block" hidden>
          <div class="kicker">이제 내 마음</div>
          <p class="big" id="selfText"></p>
          <p class="hint">“왜냐하면…” 뒤는 한 문장만 내 말로 붙여도 충분해요.</p>
        </div>

        <div id="blockSingle" class="block" hidden>
          <div class="kicker">그대로 읽기</div>
          <p class="big" id="singleText"></p>
        </div>

        <div class="actions">
          <button class="btn btn--ghost" id="btnSOS">SOS 감정 힌트</button>
          <button class="btn btn--primary" id="btnPrimary">다음</button>
        </div>
      </div>
    </section>

    <!-- End -->
    <section class="screen" id="screenEnd" hidden>
      <div class="card">
        <h1 class="h1">6턴 완료</h1>
        <p class="p">해결이 아니라 ‘이해’를 쌓은 시간이었어요.</p>

        <label class="label">오늘 한 줄 메모(선택)</label>
        <input class="input" id="inputMemo" placeholder="예: 나는 인정받고 싶었던 것 같아" maxlength="80" />

        <button class="btn btn--primary" id="btnReport">리포트 보기</button>
        <a class="link" id="linkFallback" href="#" target="_top" rel="noreferrer" hidden>리포트 열기(대체 링크)</a>
      </div>
    </section>

    <!-- SOS Modal -->
    <div class="modal" id="sosModal" hidden>
      <div class="modal__panel">
        <div class="modal__head">
          <div class="modal__title">감정 힌트</div>
          <button class="btn btn--ghost" id="btnCloseSOS">닫기</button>
        </div>
        <div class="modal__body">
          <div class="kicker">상대 감정 읽기</div>
          <div class="chips" id="chipsPartner"></div>

          <div class="divider"></div>

          <div class="kicker">내 감정 말하기</div>
          <div class="chips" id="chipsMe"></div>
        </div>
      </div>
    </div>

  </main>

  <script src="./app.js"></script>
</body>
</html>
