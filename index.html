<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>맘풀고 대화 훈련</title>
    <style>
        /* 기본 리셋 및 폰트 */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
        body { background-color: #F9F6F0; /* 따뜻한 아이보리 배경 */ display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* 앱 화면 제한 (스마트폰 뷰) */
        #app-container { width: 100%; max-width: 480px; height: 100%; background: #ffffff; display: flex; flex-direction: column; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        /* 상단 네비게이션 */
        header { padding: 20px; text-align: center; border-bottom: 1px solid #eee; background: #fff; z-index: 10; }
        .turn-info { font-size: 14px; color: #888; margin-bottom: 5px; }
        .player-info { font-size: 18px; font-weight: bold; color: #333; }
        .player-a { color: #FF7F50; } /* 딸기님 색상 */
        .player-b { color: #4A90E2; } /* 포도님 색상 */

        /* 중앙 스텝퍼 영역 */
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden; background: #F9F6F0;}
        
        /* 대화 카드 디자인 */
        .card { width: 100%; background: #fff; border-radius: 20px; padding: 30px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; transition: all 0.4s ease; opacity: 0; transform: translateY(20px); display: none; }
        .card.active { opacity: 1; transform: translateY(0); display: block; animation: slideUp 0.4s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .guide-text { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.5; }
        .script-text { font-size: 22px; font-weight: 700; color: #222; line-height: 1.4; word-break: keep-all; }
        
        /* 하단 액션 버튼 영역 */
        footer { padding: 20px; background: #fff; border-top: 1px solid #eee; }
        .action-btn { width: 100%; padding: 18px; font-size: 18px; font-weight: bold; color: #fff; background-color: #FF7F50; border: none; border-radius: 12px; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 10px rgba(255, 127, 80, 0.3); }
        .action-btn:active { background-color: #E06C42; transform: scale(0.98); }
        
        /* 메모 입력창 */
        .memo-input { width: 100%; padding: 15px; margin-top: 20px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; outline: none; }
        .memo-input:focus { border-color: #FF7F50; }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <div class="turn-info" id="turn-info">🎯 대화 준비</div>
        <div class="player-info" id="player-info">서로 마주보세요</div>
    </header>

    <main>
        <div class="card active" id="card-content">
            <!-- 내용이 JS에 의해 여기에 들어갑니다 -->
        </div>
    </main>

    <footer>
        <button class="action-btn" id="next-btn" onclick="nextStep()">🎙️ 말했어요 (훈련 시작)</button>
    </footer>
</div>

<script>
    // 1. 워드프레스에서 받아올 데이터 (테스트용 기본값 세팅)
    // 실제로는 URL이 ?userA=딸기&userB=포도 일 때 이 값을 읽어옵니다.
    const urlParams = new URLSearchParams(window.location.search);
    const userA = urlParams.get('userA') || '딸기';
    const userB = urlParams.get('userB') || '포도';

    // 2. 대본 데이터 (대표님이 주신 01. 눈빛 콘택트)
    const steps = [
        { 
            turn: "🎯 몸 풀기", player: "함께", class: "",
            guide: `${userB}님의 눈을 3초간 가만히 바라본 뒤, 깊은 숨을 내쉬어 보세요.<br>그리고 이렇게 말하며 시작합니다.`,
            script: `"${userB}님, 지금 저랑 눈이 딱 마주쳤어요."`,
            btnLabel: "🎙️ 말했어요 (훈련 시작)"
        },
        { 
            turn: "⏱ 1/6 턴", player: `${userA}님의 차례`, class: "player-a",
            guide: `${userB}님의 눈을 보며 소리 내어 읽어주세요.`,
            script: `"이렇게 마주보고 있으니 감정이고 뭐고 그냥 머리가 멍해지는 것 같아요."`,
            btnLabel: "🎙️ 소리 내어 읽었어요 (다음)"
        },
        { 
            turn: "⏱ 2/6 턴", player: `${userB}님의 차례`, class: "player-b",
            guide: `${userA}님의 눈을 보며 소리 내어 읽어주세요.`,
            script: `"${userA}님 말을 들어보니 정말 머리가 멍해서 힘드셨을 것 같아요.<br><br><span style='color:#4A90E2'>${userA}님 말을 듣고나니 저도 어떻게 해야 될지 막막해 지네요.</span>"`,
            btnLabel: "🎙️ 소리 내어 읽었어요 (다음)"
        },
        { 
            turn: "⏱ 3/6 턴", player: `${userA}님의 차례`, class: "player-a",
            guide: `${userB}님의 눈을 보며 소리 내어 읽어주세요.`,
            script: `"${userB}님 말을 듣고보니 정말 막막하시겠어요.<br><br><span style='color:#FF7F50'>${userB}님 말을 듣고 있는 저도 뭘해야 될지 몰라 답답하네요.</span>"`,
            btnLabel: "🎙️ 소리 내어 읽었어요 (다음)"
        },
        { 
            turn: "⏱ 4/6 턴", player: `${userB}님의 차례`, class: "player-b",
            guide: `${userA}님의 눈을 보며 소리 내어 읽어주세요.`,
            script: `"${userA}님 말을 들어보니 정말 답답해서 불편하실것 같아요.<br><br><span style='color:#4A90E2'>이런 ${userA}님을 보고있으니 문득 ${userA}님도, 저도 편해지면 좋겠다는 생각이 드네요.</span>"`,
            btnLabel: "🎙️ 소리 내어 읽었어요 (다음)"
        },
        { 
            turn: "⏱ 5/6 턴", player: `${userA}님의 차례`, class: "player-a",
            guide: `${userB}님의 눈을 보며 소리 내어 읽어주세요.`,
            script: `"${userB}님 말을 들어보니 그 생각이 정말 진심으로 다가와요.<br><br><span style='color:#FF7F50'>그래서 ${userB}님 말을 들으니 제 마음이 한결 편안해지네요.</span>"`,
            btnLabel: "🎙️ 소리 내어 읽었어요 (다음)"
        },
        { 
            turn: "⏱ 6/6 턴 (마지막)", player: `${userB}님의 차례`, class: "player-b",
            guide: `마지막 대본입니다. 눈을 맞추고 진심을 담아 읽어주세요.`,
            script: `"${userA}님 말을 들어보니 진짜 점점 편안해 보이세요.<br><br><span style='color:#4A90E2'>이런 ${userA}님의 모습을 보니 저도 같이 덩달아 마음이 편안해지네요.</span>"`,
            btnLabel: "🏁 대화 훈련 종료하기"
        },
        { 
            turn: "📝 마무리", player: "훈련 완료!", class: "",
            guide: "대화를 마친 지금, 서로에게 남기고 싶은 한 마디가 있나요?",
            script: `<input type="text" id="final-memo" class="memo-input" placeholder="예: 오늘 내 마음 알아줘서 고마워!">`,
            btnLabel: "🎁 우리의 진단 리포트 확인하기"
        }
    ];

    let currentStep = 0;

    // 3. 화면 업데이트 함수 (스텝퍼 로직)
    function renderStep() {
        const step = steps[currentStep];
        
        // 헤더 업데이트
        document.getElementById('turn-info').innerText = step.turn;
        document.getElementById('player-info').innerText = step.player;
        document.getElementById('player-info').className = "player-info " + step.class;

        // 카드 내용 업데이트 (애니메이션을 위해 돔 재생성)
        const cardContent = document.getElementById('card-content');
        cardContent.classList.remove('active');
        
        setTimeout(() => {
            cardContent.innerHTML = `
                <div class="guide-text">${step.guide}</div>
                <div class="script-text">${step.script}</div>
            `;
            document.getElementById('next-btn').innerText = step.btnLabel;
            cardContent.classList.add('active');
        }, 50); // 살짝 깜빡이며 넘어가는 효과
    }

    // 4. 다음 버튼 클릭 시 로직
    function nextStep() {
        if (currentStep < steps.length - 1) {
            currentStep++;
            renderStep();
        } else {
            // 마지막 화면에서 버튼 클릭 시 (워드프레스로 리다이렉트!)
            const memoValue = document.getElementById('final-memo').value;
            alert(`[시스템 메시지]\n입력하신 메모: "${memoValue}"\n\n이제 워드프레스 리포트 페이지(/talk/report)로 이동합니다! (전면 광고 노출)`);
            
            // 실제 서비스에서는 아래 코드로 워드프레스 결과창으로 이동시킵니다.
            // window.top.location.href = `https://대표님워드프레스주소.com/talk/report?memo=${encodeURIComponent(memoValue)}`;
        }
    }

    // 초기 화면 렌더링
    window.onload = renderStep;
</script>

</body>
</html>
